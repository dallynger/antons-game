<style>
  :root {
    color-scheme: dark;
    --ink: #f4f7fa;
    --ink-dim: #9fb0c4;
    --ground: #0e1726;
    --panel: #18263a;
    --panel-2: #21344d;
    --line: #2f4763;
    --accent: #ff6a2b;

    --gold: #ffce4d;

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: absolute; left: 0; right: 0;

  .hud .right { text-align: right; }

  .fuelbar {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    height: 10px; border-radius: 99px;
    background: rgba(255,255,255,.14);
    overflow: hidden; pointer-events: none;
  }
  .fuelbar i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 99px; }

  .banner {
    position: absolute; left: 50%; top: 32%;
    transform: translate(-50%,-50%) scale(.8);
    text-align: center; pointer-events: none; opacity: 0;
    transition: opacity .25s ease, transform .25s cubic-bezier(.2,1.4,.4,1);

  .banner { background: rgba(12,28,46,.82); border-radius: 16px; padding: 12px 22px; }
  .banner b { display: block; font-family: var(--display); font-size: 27px; color: #ff8c52; }
  .banner span { display: block; font-size: 12px; color: #dbe8f4; letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }

  .sheet {
    position: absolute; inset: 0;
    background: rgba(8,14,24,.92);
    display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));

  }
  .sheet h1 { font-family: var(--display); font-size: 24px; margin: 0; text-wrap: balance; }
  .sheet h2 { font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); margin: 6px 0 0; }
  .result { display: flex; gap: 22px; align-items: baseline; font-variant-numeric: tabular-nums; }

  .track { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--jersey); border-radius: 99px; }

  .shop { display: grid; gap: 8px; }
  .up {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;

  }
  .up:disabled { opacity: .45; cursor: default; }
  .up .t { display: block; font-weight: 700; font-size: 15px; }

  .pips u.on { background: var(--jersey); }
  .price { font-family: var(--display); font-size: 15px; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .up:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn {

  .btn.ghost { background: var(--panel-2); color: var(--ink); font-size: 14px; padding: 11px; }
  .sticky { position: sticky; bottom: 0; padding-top: 8px; background: linear-gradient(transparent, rgba(8,14,24,.95) 32%); }
  .gear { display: flex; flex-wrap: wrap; gap: 6px; }

  .gear button[aria-pressed="true"] { background: var(--jersey); color: #06201f; border-color: var(--jersey); font-weight: 700; }

  .sheet.menu {

  .menutop span {

  .row { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
  .coinbig { font-family: var(--display); font-size: 30px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .row .sub { font-size: 13px; color: var(--ink-dim); }
  .wear {

  }
  .wear::-webkit-scrollbar { display: none; }
  .wearbtn {
    flex: 0 0 auto; width: 76px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;

  }
  .wearbtn i { width: 26px; height: 26px; border-radius: 7px; display: block; }
  .wearbtn b { font-size: 10.5px; font-weight: 700; text-align: center; line-height: 1.15; }
  .wearbtn u { font-size: 11px; color: var(--gold); text-decoration: none; font-variant-numeric: tabular-nums; }
  .wearbtn[aria-pressed="true"] { border-color: var(--jersey); background: #1d3a4d; }
  .wearbtn[aria-pressed="true"] u { color: var(--jersey); }
  .wearbtn:disabled { opacity: .4; cursor: default; }
  .aimbar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(46px + env(safe-area-inset-bottom, 0px));
    width: min(300px, calc(100% - 48px));
    background: rgba(12,28,46,.8); border-radius: 14px; padding: 10px 14px 12px;
    text-align: center; pointer-events: none;
  }
  .aimbar span { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .aimbar .bar { position: relative; height: 14px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: visible; }
  .aimbar .bar i { display: block; height: 100%; width: 0%; border-radius: 99px; background: var(--accent); }
  .aimbar .bar u {
    position: absolute; top: -10px; left: 50%; width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 9px solid var(--jersey); transform: translateX(-50%);
  }
  .aimlabel {
    position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    background: rgba(12,28,46,.82); color: #ffb184; font-family: var(--display);
    font-size: 17px; padding: 7px 14px; border-radius: 10px; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .nowebgl {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 24px; text-align: center; background: var(--ground); color: var(--ink);
  }
  .nowebgl b { display: block; font-family: var(--display); font-size: 22px; margin-bottom: 8px; }
  .nowebgl span { display: block; font-size: 14px; color: var(--ink-dim); line-height: 1.5; max-width: 300px; }
  @media (prefers-reduced-motion: reduce) { .banner { transition: none; } }
</style>

<script>
(function () {
  "use strict";

  // ---------- Konstanten ----------
  var PPM = 2.2;            // Pixel pro Spielmeter
  var G = 0.1046;          // Schwerkraft (Zeit gestreckt, Bahnen unverändert)
  var AIR = 0.99956226;         // Luftwiderstand pro Schritt
  var STEP = 1000 / 60;
  var HALFW = 220;          // halbe Weltbreite in Metern           // halbe Pistenbreite in Metern
  var STEER = 0.038;         // seitliche Beschleunigung
  var VZMAX = 0.27;          // seitliches Tempo
  var MAX_M = 7800;

  var UPGRADES = [
    { id: "anlauf", name: "Anlauf", desc: "schneller vom Herkules weg", base: 220, effect: "Start +12 %" },
    { id: "sprit",  name: "Treibstoff", desc: "länger selbst steuern", base: 260, effect: "Schub +25 %" },
    { id: "schub",  name: "Schub", desc: "kräftiger beschleunigen", base: 300, effect: "Kraft +20 %" },
    { id: "fluegel", name: "Flügel", desc: "gleiten statt fallen", base: 380, effect: "Auftrieb +120 %" },
    { id: "kufen",  name: "Kufen", desc: "weiter rutschen", base: 320, effect: "Reibung −25 %" },
    { id: "lenk",   name: "Lenkung", desc: "Rampen sicherer treffen", base: 340, effect: "Wechsel +22 %" },
    { id: "kappe",  name: "Glückskappe", desc: "mehr auf der Strecke", base: 450, effect: "Münzen +18 %" },
    { id: "reifen", name: "Reifen", desc: "größer, glatter, springt besser", base: 400, effect: "Reibung −44 %", max: 5, ring: true }
  ];
  var MAXLVL = 5;
  function maxOf(u) { return u.max === undefined ? MAXLVL : u.max; }

  // Der aufblasbare Ring: jede Stufe ist größer, glatter und springt besser
  var RINGS = [
    { name: "Schwimmring",     r: 0.80, col: [255, 122,  72], fric: 1.00, jump: 1.00 },
    { name: "Großer Ring",     r: 0.95, col: [255, 190,  66], fric: 0.90, jump: 1.05 },
    { name: "Donut",           r: 1.10, col: [244, 130, 180], fric: 0.81, jump: 1.10 },
    { name: "Traktorschlauch", r: 1.30, col: [ 74,  86, 102], fric: 0.72, jump: 1.16 },
    { name: "Riesenreifen",    r: 1.52, col: [ 64, 206, 196], fric: 0.64, jump: 1.22 },
    { name: "Mega-Reifen",     r: 1.78, col: [162, 120, 240], fric: 0.56, jump: 1.30 }
  ];
  var SHIRTS = [
    { id: "lauf",    name: "Laufshirt",        price: 0,   base: 0x3fd0c9, stripe: null,     kind: "plain" },
    { id: "tank",    name: "Tank Top",         price: 140, base: 0xf4f7fa, stripe: 0xff6a2b, kind: "tank" },
    { id: "bergpark",name: "Bergpark 09",      price: 260, base: 0x1c1c1c, stripe: 0xffd400, kind: "stripes" },
    { id: "kaskade", name: "AC Kaskade",       price: 380, base: 0xc8102e, stripe: 0x101010, kind: "stripes" },
    { id: "herkules",name: "Herkules United",  price: 520, base: 0xd12027, stripe: 0xf4f7fa, kind: "stripes" },
    { id: "fulda",   name: "Fulda Boys",       price: 660, base: 0x1a4fa0, stripe: 0xf4f7fa, kind: "halves" },
    { id: "aue",     name: "Karlsaue 07",      price: 820, base: 0x1f7a3d, stripe: 0xf4f7fa, kind: "hoops" }
  ];
  var HATS = [
    { id: "keine",  name: "ohne",           price: 0,   col: 0 },
    { id: "band",   name: "Stirnband",      price: 90,  col: 0xff6a2b },
    { id: "bommel", name: "Bommelmütze",    price: 210, col: 0xd12027 },
    { id: "woll",   name: "Wollmütze",      price: 320, col: 0x2d6cc0 },
    { id: "helm",   name: "Helm",           price: 480, col: 0xf2c53d }
  ];
  function shirtOf() {
    for (var i = 0; i < SHIRTS.length; i++) if (SHIRTS[i].id === save.shirt) return SHIRTS[i];
    return SHIRTS[0];
  }
  function hatOf() {
    for (var i = 0; i < HATS.length; i++) if (HATS[i].id === save.hat) return HATS[i];
    return HATS[0];
  }

  function ring() { return RINGS[Math.min(RINGS.length - 1, lv("reifen"))]; }
  function ringJump() { return ring().jump; }

  var GOALS = [
    { m: 150,   name: "Oberstes Kaskadenbecken" },
    { m: 600,   name: "Fuß der Kaskaden" },
    { m: 1200,  name: "Große Fontäne" },
    { m: 1900,  name: "Löwenburg" },
    { m: 2600,  name: "Schloss Wilhelmshöhe" },
    { m: 3200,  name: "Wilhelmshöher Allee" },
    { m: 3700,  name: "Goetheanlage" },
    { m: 4100,  name: "Herkulesschule" },
    { m: 4500,  name: "Bebelplatz" },
    { m: 4900,  name: "Brüder-Grimm-Platz" },
    { m: 5300,  name: "Königsplatz" },
    { m: 5700,  name: "Friedrichsplatz" },
    { m: 6200,  name: "Orangerie" },
    { m: 6800,  name: "Über die Fulda" },
    { m: 7500,  name: "Buga-See" }
  ];

  // Versteckte persönliche Orte – kein Bonus außer dem Spielplatz
  var SECRETS = [
    { m: 3500, name: "Zuhause, Elfbuchenstraße", kind: "home" },
    { m: 3560, name: "Das Schnucken",            kind: "shop" },
    { m: 3700, name: "Spielplatz Goetheanlage",  kind: "play" },
    { m: 3900, name: "Bei Mama, Olgastraße",     kind: "home" }
  ];

  // ---------- Spielstand ----------
  var SAVE = "anton-weitflug-v1";
  var save = { coins: 0, best: 0, lv: {}, goals: {}, seen: {}, runs: 0, shirt: "lauf", hat: "keine", owned: { "shirt:lauf": 1, "hat:keine": 1 } };
  UPGRADES.forEach(function (u) { save.lv[u.id] = 0; });

  function load() {
    try {
      var raw = localStorage.getItem(SAVE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || typeof d !== "object") return;
      save.coins = d.coins | 0;
      save.best = d.best | 0;
      save.runs = d.runs | 0;
      save.goals = d.goals && typeof d.goals === "object" ? d.goals : {};
      save.seen = d.seen && typeof d.seen === "object" ? d.seen : {};
      save.owned = d.owned && typeof d.owned === "object" ? d.owned : { "shirt:lauf": 1, "hat:keine": 1 };
      save.owned["shirt:lauf"] = 1; save.owned["hat:keine"] = 1;
      save.shirt = typeof d.shirt === "string" && save.owned["shirt:" + d.shirt] ? d.shirt : "lauf";
      save.hat = typeof d.hat === "string" && save.owned["hat:" + d.hat] ? d.hat : "keine";
      UPGRADES.forEach(function (u) {
        var v = d.lv && d.lv[u.id] | 0;
        save.lv[u.id] = Math.max(0, Math.min(maxOf(u), v || 0));
      });
    } catch (e) { /* privates Fenster o.ä. – dann ohne Spielstand */ }
  }
  function store() {
    try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) {}
  }
  load();

  function lv(id) { return save.lv[id] || 0; }
  function priceOf(u) { return Math.round(u.base * Math.pow(1.62, lv(u.id))); }
  function ringName() { return ring().name; }


  // ---------- Strecke ----------
  // Höhe in Metern über dem Endniveau; der Bergpark fällt steil, die Stadt ist flach.
  function groundM(m) {
    if (m < 0) return 120;
    if (m < 900) return 120 - 74 * Math.pow(m / 900, 0.9) + 3 * Math.sin(m / 26);
    if (m < 2400) return 46 - 22 * ((m - 900) / 1500) + 3 * Math.sin(m / 170);
    if (m < 4600) return 24 - 13 * ((m - 2400) / 2200) + 2.2 * Math.sin(m / 130);
    if (m < 8400) return 10 - 7 * ((m - 4600) / 3800) + 1.6 * Math.sin(m / 190);
    return 3 - 3 * ((m - 8400) / 1600) + 1.2 * Math.sin(m / 240);
  }
  function groundY(m) { return -groundM(m) * PPM; }   // Canvas: kleiner y = höher
  function slopeAt(m) { return (groundY(m + 2) - groundY(m - 2)) / (4 * PPM); }

  // Objekte deterministisch aus der Position ableiten – keine Levelbau-Datei nötig
  function rnd(seed) { var x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }

  var objCache = {};
  function chunkObjects(ci) {
    if (objCache[ci]) return objCache[ci];
    var out = [];
    var from = ci * 200, to = from + 200;
    for (var k = 0; k < 78; k++) {
      var m = from + rnd(ci * 31 + k * 2.7) * 200;
      if (m < 40 || m > MAX_M) continue;
      var r = rnd(ci * 77 + k * 3.3);
      var pi = Math.floor(rnd(ci * 5 + k * 2.3) * PATHS);
      var oz = pathCenter(pi, m) + (rnd(ci * 13 + k * 5.1) * 2 - 1) * 5.5;
      if (r < 0.5) out.push({ m: m, z: oz, type: "coin", v: 1 });
      else if (r < 0.68) out.push({ m: m, z: oz, type: "coins", v: 5 });
      else if (r < 0.79) out.push({ m: m, z: oz, type: "pile", v: 14 });
      else if (r < 0.93) out.push({ m: m, z: oz, type: "ramp" });
      else out.push({ m: m, z: oz, type: "rock" });
    }
    SECRETS.forEach(function (s) {
      if (s.m >= from && s.m < to) {
        if (s.kind === "play") out.push({ m: s.m, z: 0, type: "ramp", big: true, secret: s });
        else out.push({ m: s.m, z: pathCenter(2, s.m) - 22, type: "house", secret: s });
      }
    });
    out.sort(function (a, b) { return a.m - b.m; });
    objCache[ci] = out;
    return out;
  }
  function objectsBetween(m0, m1) {
    var res = [];
    for (var ci = Math.floor(m0 / 200); ci <= Math.floor(m1 / 200); ci++) {
      chunkObjects(ci).forEach(function (o) { if (o.m >= m0 && o.m <= m1 && !o.gone) res.push(o); });
    }
    return res;
  }
  // Untergrund: Eis ist schnell, Stein mittel, Wiese bremst. Flecken statt Spuren.
  function zoneAt(x) {
    if (x < 700) return "bergpark_oben";
    if (x < 2700) return "bergpark";
    if (x < 3450) return "allee";
    if (x < 4950) return "westen";
    if (x < 5950) return "innenstadt";
    if (x < 6900) return "aue";
    return "fulda";
  }
  // Fünf durchgehende Bahnen ziehen sich durch die Landschaft – man wählt, welche man fährt
  var PATHS = 5, PATH_W = 19;
  function pathCenter(i, x) {
    // Bei x=0 liegen alle Bahnen gerade, damit der Start immer auf einer liegt
    var damp = Math.min(1, Math.max(0, x) / 450);
    return (i - 2) * 84
      + damp * (Math.sin(x / 430) * 20 + Math.sin(x / 190) * 7 + Math.sin(x / 260 + i * 2.1) * 9);
  }
  function pathDist(x, z) {
    var best = 1e9;
    for (var i = 0; i < PATHS; i++) {
      var d = Math.abs(z - pathCenter(i, x));
      if (d < best) best = d;
    }
    return best;
  }
  function isPath(x, z) { return pathDist(x, z) < PATH_W; }

  function isRoad(x, z) {
    var zo = zoneAt(x);
    if (zo === "allee") return Math.abs(z) < 9 || Math.abs(Math.abs(z) - 74) < 7;
    if (zo === "westen" || zo === "innenstadt") {
      var g = ((z % 62) + 62) % 62;
      return g < 9 || Math.abs(z) < 7;
    }
    return false;
  }

  function surface(m, z) {
    if (isPath(m, z)) {
      // Auf der Bahn liegt meist Eis, dazwischen Schotterflecken zum Umfahren
      var g = Math.sin(m / 62 + z / 14) + Math.sin(m / 27 - z / 9) * 0.7;
      return g > 1.05 ? 1 : 0;
    }
    var t = Math.sin(m / 95 + z / 19) + Math.sin(m / 41 - z / 11) * 0.65 + Math.sin(z / 31) * 0.4;
    return t > 0.75 ? 0 : t > -0.55 ? 1 : 2;
  }
  var FRIC = [0.99978, 0.9995, 0.9984];    // Eis gleitet, Schotter mittel, Wiese bremst
  function frictionAt(m, z) { return FRIC[surface(m, z)]; }

  // ---------- Zustand ----------
  var el = {
    c: document.getElementById("c"),
    dist: document.getElementById("hDist"),
    coins: document.getElementById("hCoins"),
    fuelBar: document.getElementById("fuelBar"),
    fuelFill: document.getElementById("fuelFill"),
    banner: document.getElementById("banner"),
    bT: document.getElementById("bTitle"),
    bS: document.getElementById("bSub"),
    sheet: document.getElementById("sheet"),
    aimBar: document.getElementById("aimBar"),
    aimFill: document.getElementById("aimFill"),
    aimDir: document.getElementById("aimDir"),
    aimText: document.getElementById("aimText"),
    aimLabel: document.getElementById("aimLabel")
  };
  var W = 0, H = 0, DPR = 1;

  window.addEventListener("resize", resize);

  var S = {
    phase: "menu",     // menu | power | angle | fly | slide | over
    x: 0, y: 0, vx: 0, vy: 0,
    z: 0, vz: 0, steer: 0,
    fuel: 0, fuelMax: 0, boosting: false,
    m: 0, best: 0, coins: 0, combo: 0, comboBest: 0,
    meter: 0, power: 0, angle: 0,
    spin: 0, t: 0, flash: 0,
    hits: 0, airTime: 0, slideTime: 0,
    newGoals: [], newSecrets: []
  };

  function puff() {}          // Staub macht jetzt die 3D-Fahne

  function startRun() {
    S.phase = "aim"; S.power = 0; S.angle = 0.5;
    aim.on = false; aim.len = 0; aim.power = 0; aim.steep = 0.7; aim.side = 0; aim.vert = 0.7;
    S.side = 0;
    S.m = 0; S.x = 0; S.y = groundY(0) - 14;
    S.vx = 0; S.vy = 0; S.z = 0; S.vz = 0; S.steer = 0;
    S.coins = 0; S.combo = 0; S.comboBest = 0; S.hits = 0;
    S.airTime = 0; S.slideTime = 0; S.spin = 0; S.lastTree = 0;
    S.newGoals = []; S.newSecrets = [];
    S.fuelMax = 176 + lv("sprit") * 51;
    S.fuel = S.fuelMax;
    objCache = {};
    el.fuelBar.hidden = false;
    el.aimBar.hidden = false;
    document.querySelector(".hud").style.opacity = "1";
    updateHud();
    hideSheet();
  }

  function launch() {
    var v0 = (3.82 + lv("anlauf") * 0.44) * (0.55 + 0.45 * S.power);
    var a = (6 + 20 * S.angle) * Math.PI / 180;
    S.vx = Math.cos(a) * v0;
    S.vy = -Math.sin(a) * v0;
    S.vz = (S.side || 0) * S.power * 0.26;     // seitlicher Anteil aus der Zwille
    S.phase = "fly";
    puff(S.x, S.y, 18, "#ffd9c2");
  }

  // ---------- Eingabe: Zwille ziehen ----------
  var aim = { on: false, x0: 0, y0: 0, x: 0, y: 0, power: 0, steep: 0.5 };

  function ptXY(e) {
    var r = el.c.getBoundingClientRect();
    var t = e.touches && e.touches[0];
    return { x: (t ? t.clientX : e.clientX) - r.left, y: (t ? t.clientY : e.clientY) - r.top };
  }
  function aimUpdate() {
    if (el.aimBar) {
      el.aimFill.style.width = (Math.min(1, aim.power) * 100).toFixed(0) + "%";
      el.aimDir.style.left = (50 + (aim.side || 0) * 46).toFixed(1) + "%";
      el.aimText.textContent = aim.on ? "loslassen zum Abschuss" : "Zwille ziehen – auch nach links und rechts";
    }
    var dx = aim.x - aim.x0, dy = aim.y - aim.y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    aim.len = len;
    aim.power = Math.min(1, len / 210);
    // wie bei einer echten Zwille: er fliegt entgegen der Zugrichtung
    aim.vert = len < 6 ? 0.7 : Math.max(0, dy) / len;      // nach unten gezogen = höher
    aim.side = len < 6 ? 0 : Math.max(-1, Math.min(1, -dx / len));  // links gezogen = nach rechts
    aim.steep = Math.max(0.08, Math.min(1, aim.vert));
  }

  function onDown(e) {
    var p = ptXY(e);
    if (S.phase === "aim") { aim.on = true; aim.x0 = p.x; aim.y0 = p.y; aim.x = p.x; aim.y = p.y; aimUpdate(); return; }
    if (S.phase === "fly" || S.phase === "slide") {
      S.held = true;
      if (S.phase === "fly") S.boosting = true;
      S.steer = steerFrom(p.x);
      return;
    }
  }
  function steerFrom(x) {
    var d = (x - W / 2) / (W * 0.34);          // Mitte = geradeaus, Rand = voll
    return Math.max(-1, Math.min(1, d));
  }
  function onMove(e) {
    var p = ptXY(e);
    if (aim.on) { aim.x = p.x; aim.y = p.y; aimUpdate(); return; }
    if (S.held) S.steer = steerFrom(p.x);
  }
  function onUp() {
    if (aim.on) {
      aim.on = false;
      el.aimBar.hidden = true; el.aimLabel.hidden = true;
      if (aim.len < 28) { el.aimBar.hidden = false; return; }
      S.power = aim.power; S.angle = aim.steep; S.side = aim.side;
      launch();
      return;
    }
    S.boosting = false;
    S.held = false;
    S.steer = 0;
  }

  el.c.addEventListener("pointerdown", onDown);
  el.c.addEventListener("pointermove", onMove);
  el.c.addEventListener("pointerup", onUp);
  el.c.addEventListener("pointercancel", onUp);
  el.c.addEventListener("pointerleave", onUp);

  // Tastatur für den Rechner
  window.addEventListener("keydown", function (e) {
    if (S.phase === "aim") {
      if (e.code === "Space") {
        e.preventDefault();
        S.power = 0.85; S.angle = 0.7; S.side = 0; launch();
      }
      return;
    }
    if (e.code === "Space") { e.preventDefault(); S.boosting = true; }
    if (e.code === "ArrowLeft") S.steer = -1;
    if (e.code === "ArrowRight") S.steer = 1;
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space") S.boosting = false;
    if (e.code === "ArrowLeft" && S.steer < 0) S.steer = 0;
    if (e.code === "ArrowRight" && S.steer > 0) S.steer = 0;
  });

  // ---------- Schritt ----------
  function step() {
    S.t++;
    if (S.flash > 0) S.flash--;

    if (S.phase === "aim") return;
    if (S.phase !== "fly" && S.phase !== "slide") return;

    if (S.phase === "fly") {
      S.airTime++;
      if (S.boosting && S.fuel > 0) {
        var p = (1 + lv("schub") * 0.2) * 0.0332;
        S.vx += p * 0.86; S.vy -= p * 0.5;
        S.fuel -= 1;
        if (S.t % 2 === 0) puff(S.x - 8, S.y + 4, 1, "#ffb08a");
      }
      S.vy += G - Math.min(G * (0.45 + lv("fluegel") * 0.05), Math.max(0, S.vx) * (0.009 + lv("fluegel") * 0.0022));
      S.vx *= AIR; S.vy *= AIR;
      S.x += S.vx; S.y += S.vy;
      S.spin += S.vx * 0.012;

      var gy = groundY(S.x / PPM);
      if (S.y >= gy) {
        S.y = gy;
        var sl = slopeAt(S.x / PPM);
        var impact = S.vy - sl * S.vx;
        if (impact > 4.68) {                        // sehr steil aufgesetzt: Stoß
          S.vx *= 0.8; S.vy = 0;
          puff(S.x, S.y, 14);
        } else {                                   // sonst geht es direkt ins Rutschen
          S.vy = sl * S.vx;
          puff(S.x, S.y, 8);
        }
        S.phase = "slide";
      }
    } else {
      S.slideTime++;
      var mNow = S.x / PPM;
      var sl2 = slopeAt(mNow);
      S.vx += -sl2 * 0.0488;                          // bergab beschleunigt
      var f = frictionAt(mNow, S.z);
      f = 1 - (1 - f) * (1 - lv("kufen") * 0.05) * ring().fric;
      S.vx *= f;
      if (S.vx < 0.055) { endRun(); return; }
      S.x += S.vx;
      S.y = groundY(S.x / PPM);
    }

    // Seitlich lenken: frei über die ganze Breite
    var acc = STEER * (1 + lv("lenk") * 0.22) * (S.phase === "fly" ? 0.55 : 1);
    S.vz += S.steer * acc;
    S.vz *= (S.phase === "fly" ? 0.998 : 0.94);
    var vmax = VZMAX * (1 + lv("lenk") * 0.18);
    if (S.vz > vmax) S.vz = vmax;
    if (S.vz < -vmax) S.vz = -vmax;
    S.z += S.vz;
    if (S.z < -HALFW) { S.z = -HALFW; S.vz = 0; }
    if (S.z > HALFW) { S.z = HALFW; S.vz = 0; }

    // Fortschritt
    var m = Math.max(0, S.x / PPM);
    if (m > S.m) S.m = m;
    if (S.m >= MAX_M) { S.m = MAX_M; endRun(); return; }

    collide();
    updateHud();

  }

  // Bäume auf der Piste: dieselbe Formel wie beim Zeichnen, damit sie auch bremsen
  function treeAt(m, z) {
    var zo = zoneAt(m);
    if (zo === "fulda") return 0;
    var lim = (zo === "bergpark_oben" || zo === "bergpark") ? 0.62 : (zo === "aue" ? 0.38 : 0.5);
    for (var xi = -1; xi <= 1; xi++) {
      var x = Math.round(m / 7) * 7 + xi * 7;
      for (var zi = -1; zi <= 1; zi++) {
        var zz = Math.round(z / 9) * 9 + zi * 9;
        if (isRoad(x, zz)) continue;
        var h = rnd(x * 0.37 + zz * 0.13);
        if (h >= lim) continue;
        var h2 = rnd(x * 0.91 + zz * 0.29), h3 = rnd(x * 1.63 + zz * 0.71);
        var tx = x + h2 * 6, tz = zz + h3 * 7;
        var pd = pathDist(tx, tz);
        if (pd < PATH_W + 3) continue;
        if (pd < PATH_W + 11 && h < 0.5) continue;
        if (Math.abs(tx - m) < 1.7 && Math.abs(tz - z) < 1.7) return x * 1000 + zz;
      }
    }
    return 0;
  }

  function collide() {
    // Baumtreffer bremsen einmal pro Baum
    if (S.phase === "slide") {
      var th = treeAt(S.x / PPM, S.z);
      if (th && th !== S.lastTree) {
        S.lastTree = th;
        S.vx *= 0.62; S.combo = 0; S.hits++;
        puff();
      }
    }
    var mNow = S.x / PPM;
    var near = objectsBetween(mNow - 6, mNow + 6);
    for (var i = 0; i < near.length; i++) {
      var o = near[i];
      if (o.gone) continue;
      var dm = Math.abs(o.m - mNow);
      var dl = Math.abs(o.z - S.z);
      if (o.type === "house") {
        if (dm < 20 && !S.newSecrets.some(function (s) { return s.m === o.secret.m; })) {
          S.newSecrets.push(o.secret);
          if (!save.seen[o.secret.name]) { save.seen[o.secret.name] = 1; store(); }
          banner(o.secret.name, "gefunden");
        }
        continue;
      }
      if (dm > 3.2 || dl > 2.1) continue;
      if (o.type === "coin" || o.type === "coins" || o.type === "pile") {
        o.gone = true;
        S.combo++;
        if (S.combo > S.comboBest) S.comboBest = S.combo;
        var mult = 1 + Math.min(S.combo, 20) * 0.04;
        S.coins += Math.round(o.v * mult * (1 + lv("kappe") * 0.18));
        puff(S.x, S.y - 12, o.type === "pile" ? 12 : 4, "#ffce4d");
        S.flash = 4;
      } else if (o.type === "ramp") {
        o.gone = true;
        if (S.phase === "slide") {
          var jump = (o.big ? 2.1 : 1.37) * ringJump();
          S.vy = -jump; S.vx *= o.big ? 1.38 : 1.22;
          S.phase = "fly";
          puff(S.x, S.y, 10, "#cfe8ff");
          if (o.secret && !S.newSecrets.some(function (s) { return s.m === o.secret.m; })) {
            S.newSecrets.push(o.secret);
            if (!save.seen[o.secret.name]) { save.seen[o.secret.name] = 1; store(); }
            banner(o.secret.name, "die Rutsche!");
          }
        }
      } else if (o.type === "rock") {
        o.gone = true;
        S.vx *= 0.72; S.combo = 0; S.hits++;
        puff(S.x, S.y - 8, 8, "#8fa6bd");
      }
    }
    // Meilensteine
    for (var k = 0; k < GOALS.length; k++) {
      var G2 = GOALS[k];
      if (S.m >= G2.m && !save.goals[G2.name]) {
        save.goals[G2.name] = 1; store();
        S.newGoals.push(G2);
        banner(G2.name, Math.round(G2.m) + " Meter");
      }
    }
  }

  var bannerTimer = 0;
  function banner(title, sub) {
    el.bT.textContent = title;
    el.bS.textContent = sub;
    el.banner.classList.add("show");
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { el.banner.classList.remove("show"); }, 1500);
  }

  function updateHud() {
    el.dist.textContent = Math.round(S.m) + " m";
    el.coins.textContent = save.coins + S.coins;
    var f = S.fuelMax ? Math.max(0, S.fuel / S.fuelMax) : 0;
    el.fuelFill.style.width = (f * 100).toFixed(1) + "%";
  }

  function endRun() {
    S.phase = "over";
    el.fuelBar.hidden = true;
    el.aimBar.hidden = true;
    el.aimLabel.hidden = true;
    var distCoins = Math.round(S.m / 22 * (1 + lv("kappe") * 0.18));
    var total = S.coins + distCoins;
    save.coins += total;
    save.runs++;
    if (S.m > save.best) save.best = Math.round(S.m);
    store();
    showSheet(distCoins, total);
  }

  // ---------- Werkstatt ----------
  function nextGoal() {
    for (var i = 0; i < GOALS.length; i++) if (!save.goals[GOALS[i].name]) return GOALS[i];
    return null;
  }

  function showSheet(distCoins, total) {
    var ng = nextGoal();
    var h = [];
    h.push('<h1>' + (S.m >= save.best ? "Neuer Rekord!" : "Angekommen") + '</h1>');
    h.push('<div class="result"><div><div class="big">' + Math.round(S.m) + ' m</div>' +
           '<div class="sub">Bestweite ' + save.best + ' m</div></div>' +
           '<div><div class="big" style="color:var(--gold)">+' + total + '</div>' +
           '<div class="sub">' + S.coins + ' gesammelt · ' + distCoins + ' für die Weite</div></div></div>');

    if (S.newSecrets.length) {
      h.push('<div class="found">Vorbeigekommen: ' + S.newSecrets.map(function (s) { return s.name; }).join(" · ") + '</div>');
    }

    if (ng) {
      var prev = 0;
      for (var i = 0; i < GOALS.length; i++) { if (GOALS[i].name === ng.name) break; prev = GOALS[i].m; }
      var pct = Math.max(0, Math.min(1, (save.best - prev) / (ng.m - prev)));
      h.push('<div class="goal"><div class="row"><span class="name">' + ng.name + '</span>' +
             '<span class="dist">' + ng.m + ' m</span></div>' +
             '<div class="track"><i style="width:' + (pct * 100).toFixed(0) + '%"></i></div></div>');
    } else {
      h.push('<div class="goal"><div class="row"><span class="name">Ganz Kassel geschafft</span></div></div>');
    }

    h.push('<h2>Werkstatt</h2><div class="shop">');
    UPGRADES.forEach(function (u) {
      var lim = maxOf(u), l = lv(u.id), max = l >= lim, p = priceOf(u);
      var can = !max && save.coins >= p;
      h.push('<button class="up" data-u="' + u.id + '"' + (can ? "" : " disabled") + '>' +
             '<span><span class="t">' + (u.ring ? ringName() : u.name) + '</span><span class="d">' + (u.ring ? (l >= lim ? u.desc : 'nächste Stufe: ' + RINGS[l + 1].name) : u.desc + ' · ' + u.effect) + '</span>' +
             '<span class="pips">' + Array.from({ length: lim }, function (_, i) {
               return '<u class="' + (i < l ? "on" : "") + '"></u>';
             }).join("") + '</span></span>' +
             '<span class="price' + (max ? " max" : "") + '">' + (max ? "voll" : p) + '</span></button>');
    });
    h.push('</div>');

    h.push('<div class="hint">Zwille nach hinten ziehen und loslassen. In der Luft tippen und halten gibt Schub, solange der Balken unten reicht. Beim Rutschen links oder rechts antippen, um die Spur zu wechseln \u2013 Rampen bringen dich wieder hoch.</div>');
    h.push(wardrobeHtml());
    h.push('<div class="sticky"><button class="btn" id="again">Nochmal</button></div>');

    el.sheet.className = "sheet";
    document.querySelector(".hud").style.opacity = "1";
    el.sheet.innerHTML = h.join("");
    el.sheet.hidden = false;
    el.sheet.scrollTop = 0;
    el.coins.textContent = save.coins;

    el.sheet.querySelectorAll("[data-u]").forEach(function (b) {
      b.addEventListener("click", function () {
        var u = UPGRADES.filter(function (x) { return x.id === b.dataset.u; })[0];
        var p = priceOf(u);
        if (save.coins < p || lv(u.id) >= maxOf(u)) return;
        save.coins -= p; save.lv[u.id]++; store();
        showSheet(distCoins, total);
      });
    });
    wireWardrobe(function () { showSheet(distCoins, total); });
    document.getElementById("again").addEventListener("click", startRun);
  }

  function hideSheet() { el.sheet.hidden = true; }

  function wardrobeHtml() {
    var h = [];
    h.push('<h2>Trikot</h2><div class="wear">');
    SHIRTS.forEach(function (sh) {
      var has = save.owned["shirt:" + sh.id], on = save.shirt === sh.id;
      h.push('<button class="wearbtn" data-shirt="' + sh.id + '" aria-pressed="' + on + '"' +
        (has || save.coins >= sh.price ? "" : " disabled") + '>' +
        '<i style="background:' + hex(sh.base) + ';box-shadow:inset 0 -7px 0 ' + hex(sh.stripe === null ? sh.base : sh.stripe) + '"></i>' +
        '<b>' + sh.name + '</b><u>' + (has ? (on ? "an" : "hab ich") : sh.price) + '</u></button>');
    });
    h.push('</div><h2>Kopf</h2><div class="wear">');
    HATS.forEach(function (ht) {
      var has = save.owned["hat:" + ht.id], on = save.hat === ht.id;
      h.push('<button class="wearbtn" data-hat="' + ht.id + '" aria-pressed="' + on + '"' +
        (has || save.coins >= ht.price ? "" : " disabled") + '>' +
        '<i style="background:' + (ht.col ? hex(ht.col) : "#43536b") + '"></i>' +
        '<b>' + ht.name + '</b><u>' + (has ? (on ? "auf" : "hab ich") : ht.price) + '</u></button>');
    });
    h.push('</div>');
    return h.join("");
  }
  function hex(n) { return "#" + ("000000" + n.toString(16)).slice(-6); }

  function wireWardrobe(redraw) {
    el.sheet.querySelectorAll("[data-shirt]").forEach(function (b) {
      b.addEventListener("click", function () {
        var sh = SHIRTS.filter(function (x) { return x.id === b.dataset.shirt; })[0];
        if (!save.owned["shirt:" + sh.id]) {
          if (save.coins < sh.price) return;
          save.coins -= sh.price; save.owned["shirt:" + sh.id] = 1;
        }
        save.shirt = sh.id; store(); redraw();
      });
    });
    el.sheet.querySelectorAll("[data-hat]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ht = HATS.filter(function (x) { return x.id === b.dataset.hat; })[0];
        if (!save.owned["hat:" + ht.id]) {
          if (save.coins < ht.price) return;
          save.coins -= ht.price; save.owned["hat:" + ht.id] = 1;
        }
        save.hat = ht.id; store(); redraw();
      });
    });
  }

  function showMenu() {
    var h = [];
    h.push('<div class="menutop"><h1>Antons Weitflug</h1>' +
           (save.best ? '<span>Bestweite ' + save.best + ' m</span>' : '<span>vom Herkules bis zur Fulda</span>') +
           '</div>');
    h.push(wardrobeHtml());
    h.push('<div class="row"><span class="coinbig">' + save.coins + '</span><span class="sub">Münzen</span></div>');
    h.push('<div class="sticky"><button class="btn" id="go">Los geht\'s</button></div>');
    el.sheet.className = "sheet menu";
    document.querySelector(".hud").style.opacity = "0";
    el.sheet.innerHTML = h.join("");
    el.sheet.hidden = false;
    el.sheet.scrollTop = 0;
    wireWardrobe(showMenu);
    document.getElementById("go").addEventListener("click", startRun);
  }

  // ---------- Darstellung: eigene Perspektive auf Canvas, ohne Bibliothek ----------
  var ctx = el.c.getContext("2d");
  var VIEW = 165;           // Sichtweite in Metern
  var FOV = 560;            // Brennweite, Pixel mal Meter
  var SEG = 3.0;            // Tiefe eines Geländestreifens
  var SPARSAM = false;
  var IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var ok3d = !!ctx;

  var cam = { x: -13, y: 5, z: 0 };
  var pitch = 0;

  function horizon() { return H * 0.34 + pitch * 300; }
  function proj(x, y, z) {
    var d = x - cam.x;
    if (d < 1.4) return null;
    var s = FOV / d;
    return { x: W / 2 + (z - cam.z) * s, y: horizon() - (y - cam.y) * s, s: s, d: d };
  }

  var C = {
    fog:   [186, 212, 233],
    ice:   [206, 232, 248],
    grit:  [176, 184, 194],
    grass: [162, 196, 160],
    side:  [172, 192, 210],
    wood:  [138,  99,  62],
    tree:  [ 58, 112,  88],
    snow:  [244, 250, 254],
    rock:  [124, 140, 156],
    gold:  [255, 200,  60],
    orange:[255, 106,  43],
    water: [ 96, 152, 196],
    wall:  [214, 222, 232],
    roof:  [148,  74,  58],
    road:  [ 84,  90, 100],
    dark:  [ 62,  88, 114]
  };
  var MAT = [C.ice, C.grit, C.grass];

  function col(c, d, shade) {
    var t = Math.min(1, Math.max(0, (d - 26) / (VIEW - 26))) * 0.9;
    var k = shade === undefined ? 1 : shade;
    return "rgb(" + ((c[0] * k) * (1 - t) + C.fog[0] * t | 0) + "," +
                    ((c[1] * k) * (1 - t) + C.fog[1] * t | 0) + "," +
                    ((c[2] * k) * (1 - t) + C.fog[2] * t | 0) + ")";
  }
  function quad(a, b, c2, d2, style) {
    if (!a || !b || !c2 || !d2) return;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c2.x, c2.y); ctx.lineTo(d2.x, d2.y);
    ctx.closePath(); ctx.fillStyle = style; ctx.fill();
  }
  // Quader: zugewandte Seite, eine Flanke, Deckel
  function box(x, y, z, w, h, dp, c) {
    var x0 = x - dp / 2, x1 = x + dp / 2, z0 = z - w / 2, z1 = z + w / 2;
    var a = proj(x0, y, z0), b = proj(x0, y, z1), c3 = proj(x0, y + h, z1), d3 = proj(x0, y + h, z0),
        e = proj(x1, y, z0), f = proj(x1, y, z1), g = proj(x1, y + h, z1), hh = proj(x1, y + h, z0);
    var dd = x0 - cam.x;
    if (z > cam.z) quad(a, e, hh, d3, col(c, dd, 0.72));
    else quad(b, f, g, c3, col(c, dd, 0.72));
    quad(d3, hh, g, c3, col(c, dd, 1.14));
    quad(a, b, c3, d3, col(c, dd, 0.95));
  }
  function cone(x, y, z, r, h, c) {
    var tip = proj(x, y + h, z), l = proj(x, y, z - r), rr = proj(x, y, z + r);
    if (!tip || !l || !rr) return;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(tip.x, tip.y); ctx.lineTo(rr.x, rr.y);
    ctx.closePath(); ctx.fillStyle = col(c, x - cam.x); ctx.fill();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, IOS ? 1.5 : 2);
    W = el.c.clientWidth; H = el.c.clientHeight;
    el.c.width = Math.round(W * DPR);
    el.c.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------- Bild ----------
  function draw() {
    if (!ok3d) return;
    var mNow = Math.max(0, S.x / PPM);
    var yNow = -S.y / PPM;
    var zNow = S.z;
    var gNow = groundM(mNow);

    if (S.phase === "menu") {
      cam.x = -9; cam.y = groundM(0) + 2.2; cam.z = 0;
      pitch = 0;
      drawSky(); drawGround(); drawWorld(0);
      drawAnton(0, groundM(0), 0, true);
      renderDone();
      return;
    }

    var aiming = S.phase === "aim";
    cam.x = mNow - (aiming ? 15 : 11.5);
    cam.y = Math.max(gNow, yNow) + (aiming ? 4.0 : 3.4);
    var tz = zNow;
    if (aiming) cam.z = tz; else cam.z += (tz - cam.z) * 0.5;
    var tp = Math.max(0, Math.min(0.34, (groundM(cam.x + 4) - groundM(cam.x + 34)) / 30));
    pitch += (tp - pitch) * 0.1;

    drawSky();
    drawGround();
    drawWorld(mNow);
    if (aiming) drawSling(mNow, gNow, zNow);
    else drawAnton(mNow, yNow, zNow, false);
    drawSnow();
    renderDone();
  }

  function renderDone() {}

  function drawSky() {
    var hz = horizon();
    var g = ctx.createLinearGradient(0, 0, 0, Math.max(1, hz + 30));
    g.addColorStop(0, "#4f86bd");
    g.addColorStop(0.62, "#93bcdd");
    g.addColorStop(1, "#bad4e9");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 30);
    ctx.fillStyle = "#dfeef8"; ctx.fillRect(0, hz, W, H - hz);
    // Wolken
    ctx.fillStyle = "rgba(255,255,255,.42)";
    for (var w = 0; w < 4; w++) {
      var cw = ((w * 340 - cam.x * 1.2) % 1000 + 1000) % 1000 - 160;
      var cy = hz * (0.2 + (w % 3) * 0.2), cr = 15 + (w % 3) * 8;
      ctx.beginPath();
      ctx.arc(cw, cy, cr, 0, 7); ctx.arc(cw + cr, cy + 3, cr * 0.8, 0, 7); ctx.arc(cw - cr * 0.9, cy + 4, cr * 0.7, 0, 7);
      ctx.fill();
    }
  }

  function drawGround() {
    var step = SPARSAM ? SEG * 1.5 : SEG;
    var d = VIEW;
    while (d > 5) {
      var st = step + d * 0.06;
      var xf = cam.x + d, xn = cam.x + d - st;
      d -= st;
      if (xf < -30) continue;
      var yf = groundM(xf), yn = groundM(xn);
      var cols = d > 90 ? 6 : d > 45 ? 10 : (SPARSAM ? 12 : 18);
      var halfZ = 18 + d * 0.4;
      var wdt = (halfZ * 2) / cols;
      for (var l = 0; l < cols; l++) {
        var a = cam.z - halfZ + l * wdt, b = a + wdt, mz = (a + b) / 2;
        var base;
        if (mz < -HALFW || mz > HALFW) base = C.side;
        else if (isRoad(xf, mz)) base = C.road;
        else if (zoneAt(xf) === "fulda" && Math.abs(mz) < 60) base = C.water;
        else base = MAT[surface(xf, mz)];
        quad(proj(xf, yf, a), proj(xf, yf, b), proj(xn, yn, b), proj(xn, yn, a), col(base, d));
      }
    }
  }

  function drawWorld(mNow) {
    var list = [];
    // Herkules am Start
    if (cam.x < 150) {
      var hx = 64, hz = -13, hg = groundM(hx) - 2;
      list.push({ d: hx - cam.x, kind: "herkules", x: hx, z: hz, y: hg });
    }
    // Landschaft im Sichtfeld
    var d = 4;
    while (d < VIEW) {
      var x = Math.round((cam.x + d) / 7) * 7;
      var halfZ = (SPARSAM ? 11 : 15) + d * (SPARSAM ? 0.26 : 0.34);
      var zc = Math.round(cam.z / 9) * 9;
      var n = Math.ceil(halfZ / 9);
      for (var i = -n; i <= n; i++) {
        var z = zc + i * 9;
        if (z < -HALFW - 40 || z > HALFW + 40) continue;
        var it = sceneryAt(x, z);
        if (it) list.push(it);
      }
      d += (SPARSAM ? 9 : 7) + d * (SPARSAM ? 0.08 : 0.05);
    }
    // Wahrzeichen
    GOALS.forEach(function (g) {
      var dd = g.m - cam.x;
      if (dd > 1 && dd < VIEW) list.push({ d: dd, kind: "goal", goal: g, x: g.m, z: 0 });
    });
    // Münzen und Hindernisse
    objectsBetween(cam.x, cam.x + VIEW).forEach(function (o) {
      if (o.gone) return;
      list.push({ d: o.m - cam.x, kind: "obj", obj: o, x: o.m, z: o.z });
    });

    list.sort(function (a, b) { return b.d - a.d; });
    list.forEach(function (it) {
      var gy = it.y !== undefined ? it.y : groundM(it.x);
      if (it.kind === "tree") {
        box(it.x, gy, it.z, 0.34 * it.sc, 1.0 * it.sc, 0.34 * it.sc, C.wood);
        cone(it.x, gy + 0.9 * it.sc, it.z, 1.15 * it.sc, 3.0 * it.sc, C.tree);
        cone(it.x, gy + 2.9 * it.sc, it.z, 0.62 * it.sc, 1.1 * it.sc, C.snow);
      } else if (it.kind === "house") {
        box(it.x, gy, it.z, it.w, it.h, it.dp, C.wall);
        box(it.x, gy + it.h, it.z, it.w + 0.8, 1.5, it.dp + 0.8, C.roof);
      } else if (it.kind === "lamp") {
        box(it.x, gy, it.z, 0.16, 4.2, 0.16, C.dark);
        box(it.x, gy + 4.1, it.z, 0.8, 0.16, 0.2, C.dark);
      } else if (it.kind === "bench") {
        box(it.x, gy + 0.4, it.z, 1.8, 0.14, 0.5, C.wood);
        box(it.x - 0.2, gy + 0.5, it.z, 1.8, 0.6, 0.12, C.wood);
      } else if (it.kind === "rail") {
        box(it.x, gy, it.z, 0.16, 0.1, 7, C.rock);
      } else if (it.kind === "herkules") {
        box(it.x, gy, it.z, 26, 3.5, 26, C.wall);
        box(it.x, gy + 3.5, it.z, 17, 13, 17, C.wall);
        box(it.x, gy + 16.5, it.z, 12, 10, 12, C.side);
        box(it.x, gy + 26.5, it.z, 6.5, 5, 6.5, C.side);
        box(it.x, gy + 31.5, it.z, 2.1, 5, 2.1, C.rock);
        box(it.x + 1.4, gy + 33.5, it.z, 0.7, 3, 0.7, C.rock);
      } else if (it.kind === "goal") {
        landmark(it.goal, it.x, gy);
      } else {
        prop(it.obj, it.x, gy, it.z);
      }
    });
  }

  // Dieselbe Verteilung wie die Kollisionsprüfung
  function sceneryAt(x, z) {
    var zo = zoneAt(x);
    var h = rnd(x * 0.37 + z * 0.13), h2 = rnd(x * 0.91 + z * 0.29), h3 = rnd(x * 1.63 + z * 0.71);
    if (isRoad(x, z)) {
      if (zo === "allee" && Math.abs(z) < 9 && (Math.round(x / 7) % 2) === 0)
        return { d: x - cam.x, kind: "rail", x: x, z: z < 0 ? -1.5 : 1.5 };
      if (h < 0.22) return { d: x - cam.x, kind: "lamp", x: x, z: z + (h2 < 0.5 ? -4.5 : 4.5) };
      return null;
    }
    var tx = x + h2 * 6, tz = z + h3 * 7;
    var pd = pathDist(tx, tz);
    if (pd < PATH_W + 3) return null;
    if (pd < PATH_W + 11 && h < 0.5) return null;

    if (zo === "bergpark_oben" || zo === "bergpark") {
      if (h < 0.62) return { d: tx - cam.x, kind: "tree", x: tx, z: tz, sc: 0.7 + h2 * 1.0 };
      if (h > 0.96) return { d: x - cam.x, kind: "bench", x: x, z: z };
    } else if (zo === "allee" || zo === "westen" || zo === "innenstadt") {
      var big = zo === "innenstadt";
      if (h < 0.5) return { d: tx - cam.x, kind: "house", x: tx, z: tz,
                            w: 7 + h2 * 6, dp: 8 + h * 7, h: (big ? 12 : 8) + h3 * (big ? 12 : 8) };
      if (h < 0.62) return { d: tx - cam.x, kind: "tree", x: tx, z: tz, sc: 0.85 + h3 * 0.5 };
    } else {
      if (zo === "fulda" && Math.abs(z) < 60) return null;
      if (h < 0.38) return { d: tx - cam.x, kind: "tree", x: tx, z: tz, sc: 0.9 + h2 * 0.8 };
      if (h > 0.93) return { d: x - cam.x, kind: "bench", x: x, z: z };
    }
    return null;
  }

  function prop(o, x, gy, z) {
    if (o.type === "coin" || o.type === "coins" || o.type === "pile") {
      var n = o.type === "coin" ? 1 : o.type === "coins" ? 3 : 7;
      for (var i = 0; i < n; i++) {
        var p = proj(x, gy + 0.95 + Math.floor(i / 3) * 1.05 + Math.sin((S.t + i * 11) / 22) * 0.1,
                     z + ((i % 3) - 1) * 1.0);
        if (!p) continue;
        var r = Math.min(0.52 * p.s, 26);
        ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 0.45, r, 0, 0, 7);
        ctx.fillStyle = col(C.gold, p.d); ctx.fill();
      }
    } else if (o.type === "ramp") {
      var w = o.big ? 4.2 : 2.8, h = o.big ? 1.7 : 1.0, dp = o.big ? 5.5 : 3.8;
      var c2 = o.big ? C.orange : C.side;
      var x0 = x - dp / 2, x1 = x + dp / 2, z0 = z - w / 2, z1 = z + w / 2;
      quad(proj(x0, gy, z0), proj(x0, gy, z1), proj(x1, gy + h, z1), proj(x1, gy + h, z0), col(c2, x0 - cam.x, 1.06));
      quad(proj(x1, gy, z0), proj(x1, gy, z1), proj(x1, gy + h, z1), proj(x1, gy + h, z0), col(c2, x1 - cam.x, 0.7));
    } else if (o.type === "rock") {
      box(x, gy, z, 1.6, 1.1, 1.6, C.rock);
    } else if (o.type === "house") {
      var lit = S.newSecrets.some(function (sx) { return sx.m === o.secret.m; });
      box(x, gy, z, 7, 6, 7, C.wall);
      box(x, gy + 6, z, 7.8, 1.8, 7.8, C.roof);
      var p2 = proj(x - 3.6, gy + 3.4, z);
      if (p2) {
        ctx.fillStyle = lit ? "rgb(255,214,120)" : col(C.dark, p2.d);
        ctx.fillRect(p2.x - 0.55 * p2.s, p2.y - 0.55 * p2.s, 1.1 * p2.s, 1.1 * p2.s);
      }
    }
  }

  function landmark(g, x, gy) {
    var n = g.name, off = HALFW * 0 + 26;
    if (n.indexOf("Kaskaden") >= 0 || n.indexOf("Becken") >= 0) {
      for (var i = 0; i < 6; i++) box(x + i * 3.6, gy + i * 0.85, 0, 46, 0.9, 3.4, C.wall);
    } else if (n.indexOf("Fontäne") >= 0) {
      box(x, gy, -off, 7, 0.7, 7, C.water);
      box(x, gy + 0.7, -off, 0.7, 11, 0.7, C.snow);
    } else if (n.indexOf("Schloss") >= 0 || n.indexOf("Löwenburg") >= 0) {
      box(x, gy, -off - 5, 17, 9, 10, C.wall);
      box(x - 7, gy, -off - 5, 5, 16, 5, C.wall);
      box(x + 7, gy, -off - 5, 5, 16, 5, C.wall);
    } else if (n.indexOf("Schule") >= 0) {
      box(x, gy, off + 4, 19, 8, 11, C.wall);
      box(x, gy + 8, off + 4, 20, 1.4, 12, C.roof);
    } else if (n.indexOf("Orangerie") >= 0) {
      box(x, gy, -off - 3, 42, 7, 9, C.wall);
    } else if (n.indexOf("Fulda") >= 0 || n.indexOf("See") >= 0) {
      box(x, gy - 0.4, 0, HALFW * 1.6, 0.5, 24, C.water);
    } else {
      box(x, gy, -off - 4, 15, 11, 12, C.wall);
      box(x, gy, off + 4, 14, 9, 11, C.side);
    }
  }

  function drawAnton(mNow, yNow, zNow, inMenu) {
    var r = ring(), sh = shirtOf(), ht = hatOf();
    var p = proj(mNow, yNow, zNow);
    if (!p) return;
    var s = p.s;
    var lean = inMenu ? 0 : Math.max(-0.5, Math.min(0.5, -S.vz * 2.0));

    // Schatten
    var gp = proj(mNow, groundM(mNow) + 0.03, zNow);
    if (gp && yNow > groundM(mNow) + 0.25) {
      ctx.globalAlpha = Math.max(0.06, 0.28 - (yNow - groundM(mNow)) * 0.02);
      ctx.fillStyle = "#54728f";
      ctx.beginPath(); ctx.ellipse(gp.x, gp.y, r.r * gp.s, r.r * 0.34 * gp.s, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(lean * 0.3);

    function rect(dx, dy, w, h, c, shade) {
      ctx.fillStyle = col(c, p.d, shade);
      ctx.fillRect(dx * s, dy * s, w * s, h * s);
    }
    function rectHex(dx, dy, w, h, hexv) {
      ctx.fillStyle = "#" + ("000000" + hexv.toString(16)).slice(-6);
      ctx.fillRect(dx * s, dy * s, w * s, h * s);
    }

    // Ring hinter der Figur
    ctx.fillStyle = "rgb(" + (r.col[0] * 0.8 | 0) + "," + (r.col[1] * 0.8 | 0) + "," + (r.col[2] * 0.8 | 0) + ")";
    ctx.beginPath(); ctx.ellipse(0, -0.18 * s, r.r * 1.15 * s, r.r * 0.5 * s, 0, 0, 7); ctx.fill();

    // Beine nach vorn, sitzend
    rect(-0.2, -0.62, 0.4, 0.3, [43, 63, 96], 1);
    // Oberkörper
    rectHex(-0.26, -1.36, 0.52, 0.76, sh.base);
    if (sh.kind === "stripes" && sh.stripe !== null) {
      for (var i = 0; i < 3; i++) rectHex(-0.22 + i * 0.16, -1.36, 0.07, 0.76, sh.stripe);
    } else if ((sh.kind === "hoops" || sh.kind === "tank") && sh.stripe !== null) {
      for (var k = 0; k < 2; k++) rectHex(-0.26, -1.2 + k * 0.26, 0.52, 0.1, sh.stripe);
    }
    if (sh.kind !== "tank") {
      rect(-0.42, -1.34, 0.17, 0.66, [39, 64, 95], 1);
      rect(0.25, -1.34, 0.17, 0.66, [39, 64, 95], 1);
    }
    // Kopf
    rect(-0.22, -1.82, 0.44, 0.46, [240, 201, 164], 1);
    if (ht.id === "keine" || ht.id === "band") rect(-0.24, -1.9, 0.48, 0.2, [107, 69, 39], 1);
    if (ht.id === "band") rectHex(-0.24, -1.76, 0.48, 0.12, ht.col);
    else if (ht.id !== "keine") {
      rectHex(-0.25, -2.02, 0.5, 0.28, ht.col);
      if (ht.id === "bommel") {
        ctx.fillStyle = "#f4f7fa";
        ctx.beginPath(); ctx.arc(0, -2.12 * s, 0.12 * s, 0, 7); ctx.fill();
      }
    }
    // Brille
    rect(-0.24, -1.7, 0.48, 0.1, C.orange, 1);

    // Flügel
    var wl = lv("fluegel");
    if (wl > 0) {
      var ws = 0.5 + wl * 0.2;
      rect(-0.3 - ws, -1.0, ws, 0.1, [223, 233, 243], 1);
      rect(0.3, -1.0, ws, 0.1, [223, 233, 243], 1);
    }

    // Ring vorne
    ctx.fillStyle = "rgb(" + r.col[0] + "," + r.col[1] + "," + r.col[2] + ")";
    ctx.beginPath(); ctx.ellipse(0, -0.05 * s, r.r * 1.15 * s, r.r * 0.46 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    ctx.beginPath(); ctx.ellipse(0, -0.1 * s, r.r * 0.55 * s, r.r * 0.2 * s, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawSling(mNow, gNow, zNow) {
    var pull = 0.5 + aim.power * 2.2;
    var ax = mNow - pull, az = -(aim.side || 0) * aim.power * 3.2;

    box(mNow + 0.2, gNow - 0.9, 0, 4.6, 0.9, 5, C.wall);
    box(mNow + 0.4, gNow, -1.15, 0.22, 2.5, 0.22, C.wood);
    box(mNow + 0.4, gNow, 1.15, 0.22, 2.5, 0.22, C.wood);
    box(mNow + 0.4, gNow, 0, 0.42, 0.4, 0.42, C.wood);

    drawAnton(ax, gNow - aim.power * 0.4, az, true);

    var tipL = proj(mNow + 0.4, gNow + 2.5, -1.15),
        tipR = proj(mNow + 0.4, gNow + 2.5, 1.15),
        hold = proj(ax, gNow + 0.9, az);
    if (tipL && tipR && hold) {
      var t = aim.power;
      ctx.strokeStyle = "rgb(" + (110 + 145 * t | 0) + "," + (150 - 60 * t | 0) + "," + (70 - 30 * t | 0) + ")";
      ctx.lineWidth = Math.max(2, (0.14 - 0.04 * t) * hold.s);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tipL.x, tipL.y); ctx.lineTo(hold.x, hold.y); ctx.lineTo(tipR.x, tipR.y);
      ctx.stroke();
    }

    if (aim.on && aim.len > 28) {
      var v0 = (3.82 + lv("anlauf") * 0.44) * (0.55 + 0.45 * aim.power);
      var a = (6 + 20 * aim.steep) * Math.PI / 180;
      var vx = Math.cos(a) * v0, vy = -Math.sin(a) * v0;
      var vz = (aim.side || 0) * aim.power * 0.26;
      var x = ax * PPM, y = -(gNow - aim.power * 0.4) * PPM, z = az, land = null, lz = az;
      ctx.fillStyle = "rgba(255,138,74,.92)";
      for (var i = 0; i < 4000; i++) {
        vy += G - Math.min(G * (0.45 + lv("fluegel") * 0.05), Math.max(0, vx) * (0.009 + lv("fluegel") * 0.0022));
        vx *= AIR; vy *= AIR; x += vx; y += vy;
        vz *= 0.998; z += vz;
        if (z < -HALFW) { z = -HALFW; vz = 0; }
        if (z > HALFW) { z = HALFW; vz = 0; }
        var mm = x / PPM;
        if (i % 16 === 0 && i < 260) {
          var pp = proj(mm, -y / PPM, z);
          if (pp) { ctx.beginPath(); ctx.arc(pp.x, pp.y, Math.max(2, Math.min(0.13 * pp.s, 9)), 0, 7); ctx.fill(); }
        }
        if (y >= groundY(mm)) { land = mm; lz = z; break; }
      }
      if (land) {
        var lp = proj(land, groundM(land) + 0.06, lz);
        if (lp) {
          ctx.strokeStyle = "rgba(255,106,43,.95)";
          ctx.lineWidth = Math.max(2, Math.min(0.12 * lp.s, 7));
          ctx.beginPath();
          ctx.ellipse(lp.x, lp.y, Math.min(2 * lp.s, 110), Math.min(0.7 * lp.s, 38), 0, 0, 7);
          ctx.stroke();
        }
        el.aimLabel.textContent = Math.round(land) + " m";
        el.aimLabel.hidden = false;
      }
    } else {
      el.aimLabel.hidden = true;
    }
  }

  var flakes = [];
  for (var fi = 0; fi < 22; fi++) flakes.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 1.8 });
  function drawSnow() {
    if (S.phase !== "fly" && S.phase !== "slide") return;
    var sp = Math.abs(S.vx) * 0.002;
    ctx.fillStyle = "rgba(255,255,255,.62)";
    flakes.forEach(function (f) {
      f.x -= sp + 0.003; f.y += 0.0014;
      if (f.x < -0.05) { f.x = 1.05; f.y = Math.random(); }
      if (f.y > 1) f.y = 0;
      ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r, 0, 7); ctx.fill();
    });
  }

  // ---------- Schleife ----------
  var acc = 0, last = 0;
  function frame(now) {
    if (!last) last = now;
    acc += Math.min(now - last, 120);
    last = now;
    while (acc >= STEP) { step(); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }

  var loadEl = document.getElementById("boot");
  var msgEl = document.getElementById("loadMsg");

  function fail(text) {
    if (msgEl) msgEl.textContent = text;
    if (loadEl) { loadEl.hidden = false; loadEl.style.display = "grid"; }
    var f = document.getElementById("bootfill");
    if (f) f.style.background = "#c8503a";
  }

  if (!ok3d) {
    fail("Dieses Gerät kann die Grafik nicht anzeigen.");
    return;
  }

  window.__boot(70, "Welt wird gebaut …");
  try {
    resize();
  } catch (e) {
    fail("Die 3D-Ansicht lässt sich auf diesem Gerät nicht starten. (" + (e && e.message ? e.message : "unbekannt") + ")");
    return;
  }

  window.__boot(100, "Fertig");
  if (loadEl) {
    loadEl.style.transition = "opacity .3s ease";
    loadEl.style.opacity = "0";
    setTimeout(function () { loadEl.style.display = "none"; }, 320);
  }
  updateHud();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
